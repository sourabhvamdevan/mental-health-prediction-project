

services:
 
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

 
  backend:
    build: ./server
    container_name: backend_container
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mental_health
    depends_on:
      - mongodb


  client:
    build: ./client
    container_name: react_client_container
    ports:
      - "3000:80" 
    depends_on:
      - backend

volumes:
  mongo-data: